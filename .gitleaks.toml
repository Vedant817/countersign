# gitleaks configuration — spec §8.0, AGENTS.md rule 4.
#
# CI scans full history on every push and PR. `pnpm secret-scan` scans locally. This file tunes the
# default rules only with narrowly-scoped exceptions:
#
#  - **Fewer false positives**, without excluding entire documentation, fixture, or lockfile paths.
#  - **No genuine secret is allowlisted.** Any new exception must match a specific non-credential.
#
# `--redact` prevents a reported value from being printed in local logs or CI.

[extend]
useDefault = true

# Historical WP-14 test vectors. New tests generate keys at runtime. Match both the exact
# historical test path and the exact public dummy value; every other value stays scanned.
[[allowlists]]
description = "Historical merchant MCP route dummy signing key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/web/app/api/mcp/\[transport\]/route\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^mcp-route-test-secret-0123456789abcdef$''']

[[allowlists]]
description = "Historical merchant MCP wrong-key test vector"
targetRules = ["countersign-session-secret"]
condition = "AND"
paths = ['''^apps/web/lib/mcp-token\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^a-different-secret-that-is-long-enough-123456$''']

[[allowlists]]
description = "Non-credential strings that match a generic secret pattern"
regexTarget = "match"

# --- PayPal client IDs are not secrets ---
#
# `PAYPAL_CLIENT_ID` is an identifier, not a credential: it appears in browser-visible settings and in
# the OAuth token request, and it grants nothing on its own. The *secret* is caught by the generic
# high-entropy rule and by the keyword rules. Flagging the client id would train a reviewer to ignore
# this file.
regexes = [
  # Sandbox and live client ids: A + 13 alphanumerics + a dash + a long suffix.
  '''^A[A-Z0-9]{13}-[A-Za-z0-9_-]{20,}$''',
]

# Reviewed non-credentials in these exact files. Gitleaks suppresses every rule in an allowlisted
# file, so re-triage any content changes before extending this list. Other fixture paths remain scanned.
[[allowlists]]
description = "Reviewed docs, local test credentials, and signed sandbox fixture data"
paths = [
  '''^\.env\.example$''',
  '''^\.github/workflows/ci\.yml$''',
  '''^\.github/workflows/sandbox-nightly\.yml$''',
  '''^apps/vi/tests/test_l3\.py$''',
  '''^apps/web/app/status/status\.test\.ts$''',
  '''^apps/worker/src/boot\.test\.ts$''',
  '''^docker-compose\.yml$''',
  '''^docs/verification/paypal-api-2026-10-04\.md$''',
  '''^packages/core/test/env\.test\.ts$''',
  '''^packages/defender/test/evidence-doc\.test\.ts$''',
  '''^packages/gate/src/decision-record\.ts$''',
  '''^packages/gate/test/fixtures/vi-binding-replay-capture\.json$''',
  '''^packages/gate/test/fixtures/vi-verify-budget-capture\.json$''',
  '''^packages/paypal/src/idempotency\.ts$''',
  '''^packages/verifier/test/fixtures/chain\.json$''',
  '''^packages/vi-client/test/fixtures/README\.md$''',
]

# Named-secret rules supplement Gitleaks defaults for the configuration this project actually uses.
[[rules]]
id = "countersign-paypal-client-secret"
description = "PayPal client secret assignment"
regex = '''(?i)\bPAYPAL_CLIENT_SECRET\b\s*[:=]\s*["']?([A-Za-z0-9._~+/=-]{16,})'''
secretGroup = 1
entropy = 3.5
keywords = ["PAYPAL_CLIENT_SECRET"]

[[rules]]
id = "countersign-openai-api-key"
description = "OpenAI API key assignment"
regex = '''(?i)\bOPENAI_API_KEY\b\s*[:=]\s*["']?((?:sk|sess)-[A-Za-z0-9_-]{20,})'''
secretGroup = 1
entropy = 3.5
keywords = ["OPENAI_API_KEY"]

[[rules]]
id = "countersign-vi-kek"
description = "VI key-encryption key assignment"
regex = '''(?i)\bVI_KEK\b\s*[:=]\s*["']?([A-Za-z0-9+/]{42,}={0,2})'''
secretGroup = 1
entropy = 3.5
keywords = ["VI_KEK"]

# The public test KEK (bytes 0x00-0x1f) used by the API, web app and E2E suites. It must never protect
# anything real, and production keys come from the environment only (spec §6). Matching the value
# rather than the file keeps every other rule active in the Playwright config.
[[rules.allowlists]]
description = "Public test VI KEK"
regexTarget = "secret"
regexes = ['''^AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=$''']

[[rules]]
id = "countersign-session-secret"
description = "Session secret assignment"
regex = '''(?i)\bSESSION_SECRET\b\s*[:=]\s*["']?([A-Za-z0-9._~+/=-]{24,})'''
secretGroup = 1
entropy = 3.5
keywords = ["SESSION_SECRET"]

[[rules]]
id = "countersign-database-url-credentials"
description = "Database URL with embedded credentials"
regex = '''(?i)\bDATABASE_URL\b\s*[:=]\s*["']?[A-Za-z][A-Za-z0-9+.-]*://[^:@\s/]+:([^@\s/]+)@[^ \t"'#]+'''
secretGroup = 1
keywords = ["DATABASE_URL"]

[[rules]]
id = "countersign-gate-private-jwk"
description = "Gate signing private JWK"
regex = '''(?i)\bGATE_SIGNING_KEY\b[\s\S]{0,256}?"(?:d|p|q|dp|dq|qi|k)"\s*:\s*"([A-Za-z0-9_-]{32,})"'''
secretGroup = 1
entropy = 3.5
keywords = ["GATE_SIGNING_KEY"]

[[rules]]
id = "countersign-vi-kid-private-jwk"
description = "VI private JWK attached to a key identifier"
# KIDs are public identifiers; only private material next to them is a secret.
regex = '''(?i)\bVI_[A-Z0-9_]*_KID\b[\s\S]{0,256}?"(?:d|p|q|dp|dq|qi|k)"\s*:\s*"([A-Za-z0-9_-]{32,})"'''
secretGroup = 1
entropy = 3.5
keywords = ["VI_"]

[[rules]]
id = "countersign-vi-kid-private-pem"
description = "VI private PEM attached to a key identifier"
regex = '''(?i)\bVI_[A-Z0-9_]*_KID\b[\s\S]{0,256}?(-----BEGIN [A-Z ]*PRIVATE KEY-----\s*[A-Za-z0-9+/=\r\n]{32,}-----END [A-Z ]*PRIVATE KEY-----)'''
secretGroup = 1
entropy = 3.5
keywords = ["VI_"]
