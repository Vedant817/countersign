[project]
name = "vi-service"
version = "0.1.0"
description = "Countersign vi-service — the crypto oracle for Verifiable Intent (spec D2, §8.3)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  # --- pinned by spec §4 / §22.1 [B18]; verified on PyPI 2026-10-04 (docs/DECISIONS.md D-003) ---
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",

  # [B1] Not on PyPI. Pinned to the exact commit the spec verified, because the constraint field
  # names in §8.8 and the two-phase signing behaviour in §11 C3(a) are read off that tree.
  # https://github.com/agent-intent/verifiable-intent/commit/356c29635f1c44df7de02edb58699ca9f29bece6
  "verifiable-intent @ git+https://github.com/agent-intent/verifiable-intent@356c29635f1c44df7de02edb58699ca9f29bece6",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "pytest-asyncio==1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vi_service"]

[tool.hatch.metadata]
# The pinned Verifiable Intent dependency is a direct VCS reference, which hatchling refuses by
# default. Opting in explicitly is also a useful tripwire: if anyone ever unpins that dependency,
# this is the line they have to delete, and it is reviewed like any other change to the crypto core.
# See docs/DECISIONS.md D-002 for the full pinning rationale.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:vi_service.*"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = [
  "ANN101", # `self` needs no annotation
  "ANN102", # `cls` needs no annotation
]